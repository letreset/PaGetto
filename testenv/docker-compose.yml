# Local test environment: the latest PaGetto image with a ready-made data set.
# See docs/docs/Advanced/test-environment.md.
#
#   docker compose -f testenv/docker-compose.yml up -d      # http://localhost:5000
#   docker compose -f testenv/docker-compose.yml down -v    # stop and reset to the snapshot
#
# testenv/data is the committed snapshot (SQLite database and package files). It is mounted
# read-only and copied into the `data` volume on the first start, so testing never changes the
# working tree. Set PAGETTO_TAG to test another image, e.g. PAGETTO_TAG=2.1.0.

name: pagetto-test

services:
  seed-data:
    image: letreset/pagetto:${PAGETTO_TAG:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${TESTENV_EMPTY:-0}" = "1" ]; then echo "Starting empty"; exit 0; fi
        if [ -f /data/db/pagetto.db ]; then echo "Data volume already initialized"; exit 0; fi
        cp -a /snapshot/. /data/ && echo "Copied the test data snapshot"
    environment:
      TESTENV_EMPTY: ${TESTENV_EMPTY:-0}
    volumes:
      - ./data:/snapshot:ro
      - data:/data

  pagetto:
    image: letreset/pagetto:${PAGETTO_TAG:-latest}
    depends_on:
      seed-data:
        condition: service_completed_successfully
    ports:
      - "${PAGETTO_PORT:-5000}:8080"
    environment:
      # Development: detailed error pages, sign-in cookies that also work over plain HTTP on any
      # host name, and no HSTS. Never use this for a real server.
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Mode: Local
      Logging__Console__LogLevel__Default: Information
    volumes:
      - data:/data

volumes:
  data:
