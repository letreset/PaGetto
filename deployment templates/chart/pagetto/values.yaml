---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.0.1/charts/other/app-template/values.schema.json

#
# IMPORTANT NOTE
#
# This chart inherits from the common library chart. You can check the default values/options here:
# https://github.com/bjw-s/helm-charts/tree/main/charts/library/common/values.yaml
#

# -- environment variables. See more environment variables in the [PaGetto documentation](https://letreset.github.io/PaGetto/docs/Installation/docker).
# @default -- See below
configMaps:
  pagetto-env:
    data:
      # -- Authentication mode (required): Local, Entra, Hybrid or Legacy. With Local, the administrator
      # admin/admin is created on startup while no admin exists; it has to change the password on the
      # first sign-in.
      Authentication__Mode: "Local"
      # -- Legacy mode only: the NuGet API key for pushes (better from a Secret)
      #Authentication__ApiKeys__0__Key: "ChangeMe"
      # -- Set database and storage settings
      Storage__Type: "FileSystem"
      Storage__Path: "/data"
      Database__Type: "Sqlite"
      Database__ConnectionString: "Data Source=/data/pagetto.db"
      # -- SQLite journal mode: DELETE, TRUNCATE, PERSIST, MEMORY, WAL or OFF. Unset keeps the current mode.
      # Do not use WAL on network volumes (NFS, SMB, many RWX volumes) shared by pods on different nodes.
      #Database__JournalMode: "WAL"
      # -- Additional settings. See [PaGetto configuration](https://letreset.github.io/PaGetto/docs/configuration)
      #PackageDeletionBehavior: "HardDelete"

# -- Configures containers for the chart.
# @default -- See values.yaml
controllers:
  pagetto:
    containers:
      pagetto:
        image:
          # -- image repository
          repository: letreset/pagetto
          # -- image tag
          tag: latest
          # -- image pull policy
          pullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name: pagetto-pagetto-env
        # -- Secret-backed settings, e.g. a database connection string:
        # kubectl create secret generic pagetto-database --from-literal=connection-string=...
        #env:
        #  Database__ConnectionString:
        #    valueFrom:
        #      secretKeyRef:
        #        name: pagetto-database
        #        key: connection-string
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
        # /livez never touches dependencies; /health (HealthCheck:Path) checks the database only, not storage.
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /livez
          readiness:
            enabled: true
            type: HTTP
            path: /health

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  pagetto-srv:
    controller: pagetto
    ports:
      http:
        port: 8080

# -- Enable and configure ingress settings for the chart under this key.
# @default -- See values.yaml
ingress:
  pagetto-ingress:
    enabled: false
    # className: "ingress-nginx"
    hosts: []
      # - host: pagetto.mydomain.com
      #   paths:
      #     - path: /
      #       service:
      #         identifier: pagetto-srv
      #         port: 8080

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  pagetto-data:
    enabled: true
    accessMode: "ReadWriteOnce"
    size: "10Gi"
    globalMounts:
      - path: "/data"
