version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # A package goes to the first group that matches it. Major updates outside the first two
    # groups get a PR of their own, so one breaking package doesn't hold back the rest.
    groups:
      # EF Core and its providers must move together.
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "Microting.EntityFrameworkCore.MySql"
      nuget-client:
        patterns: ["NuGet.*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # NuGet client 7.x drops netstandard2.0, which PaGetto.Protocol targets, and all three
      # NuGet.* packages must share one version now that transitive pinning is on.
      - dependency-name: "NuGet.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for all updates, so a week's bumps run CI and CodeQL once.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
