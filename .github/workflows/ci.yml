name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # No paths-ignore here: the ruleset on main requires these checks, so a pull request that
  # skipped CI (e.g. docs only) could never be merged.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A push to main re-runs what its pull request already passed, and the ruleset doesn't
        # require branches to be up to date, so ubuntu alone is enough as a post-merge check.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  helm:
    name: Helm lint
    # Already checked on the pull request, and nothing on main depends on it.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and render chart
        run: |
          chart="deployment templates/chart/pagetto"
          helm dependency update "$chart"
          helm lint "$chart"
          helm template pagetto "$chart" > /dev/null

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          # Only main writes the cache: pull requests read main's cache but not each other's,
          # so their writes would only evict main's entries from the 10 GB limit.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
