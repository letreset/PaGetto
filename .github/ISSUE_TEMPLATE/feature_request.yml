name: Feature request
description: Suggest an idea for PaGetto
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
      placeholder: I'm trying to [...] but [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links or anything else that helps.
